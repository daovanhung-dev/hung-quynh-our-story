name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare media variants
        run: npm run prepare:media

      - name: Validate memories
        run: npm run validate:memories

      - name: Generate memories
        run: npm run generate:memories

      - name: Build Angular
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          npx ng build \
            --configuration production \
            --base-href "/${REPO_NAME}/"

      - name: Prepare static hosting
        run: npm run prepare:static

      - name: Verify artifact
        shell: bash
        run: |
          test -f dist/our-story/index.html
          test -f dist/our-story/404.html
          test -f dist/our-story/.nojekyll
          test -f dist/our-story/favicon.svg
          test -d dist/our-story/images/memories
          grep -q '<base href="/hung-quynh-our-story/">' dist/our-story/index.html

      - name: Verify manifest assets
        run: npm run verify:artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/our-story

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
